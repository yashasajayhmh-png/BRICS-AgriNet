<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#065f46" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <linearGradient id="leaf" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="sun" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="100" fill="url(#bg)" />
  <!-- Soil horizon lines -->
  <path d="M 64 380 Q 256 340 448 380" stroke="#047857" stroke-width="12" fill="none" stroke-linecap="round" />
  <path d="M 96 420 Q 256 385 416 420" stroke="#065f46" stroke-width="8" fill="none" stroke-linecap="round" />
  <!-- Sun / Satellite Orbit -->
  <circle cx="360" cy="140" r="44" fill="url(#sun)" opacity="0.9" />
  <path d="M 330 110 A 50 50 0 0 1 420 160" stroke="#fef3c7" stroke-width="6" fill="none" stroke-linecap="round" />
  <!-- Central Crop Sprout -->
  <path d="M 256 370 C 256 260 256 220 256 160" stroke="#10b981" stroke-width="16" stroke-linecap="round" />
  <!-- Left Leaf -->
  <path d="M 256 270 C 180 270 140 210 140 160 C 200 160 256 210 256 270 Z" fill="url(#leaf)" />
  <!-- Right Leaf -->
  <path d="M 256 220 C 330 220 370 160 370 110 C 310 110 256 160 256 220 Z" fill="url(#leaf)" />
</svg>
